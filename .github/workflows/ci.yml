name: ci

on: [push]
jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: 3.8
      - name: Bootstrap poetry
        run: |
          curl -sSL https://install.python-poetry.org | python - -y --version 1.5.1
      - name: Install dependencies
        run: poetry install
      - name: Compile
        run: poetry run mypy .
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            lockfile: true
          - python-version: "3.13"
            lockfile: true
          # poetry.lock is resolved for Python 3.8, and its pydantic-core has no 3.14 wheels and
          # won't build there, so 3.14 installs the latest dependencies the way users on 3.14 do.
          - python-version: "3.14"
            lockfile: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Bootstrap poetry
        if: matrix.lockfile
        run: |
          curl -sSL https://install.python-poetry.org | python - -y --version 1.5.1
      - name: Install dependencies
        if: matrix.lockfile
        run: |
          poetry install
      - name: Install latest dependencies
        if: ${{ !matrix.lockfile }}
        run: |
          python -m pip install -e . pytest pytest-asyncio pytest-xdist python-dateutil
      - name: Verify types
        if: matrix.lockfile
        run: poetry run python tests/verify_types.py
      - name: Test
        run: ${{ matrix.lockfile && 'poetry run pytest .' || 'python -m pytest .' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

  publish:
    needs: [compile, test]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: pypi-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: 3.8
      - name: Bootstrap poetry
        run: |
          curl -sSL https://install.python-poetry.org | python - -y --version 1.5.1
      - name: Install dependencies
        run: poetry install
      - name: Build package
        run: poetry build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
